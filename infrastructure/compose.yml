services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ../:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  php:
    build: .
    volumes:
      - ../:/var/www/html

  db:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-php-blog}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: